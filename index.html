<!DOCTYPE html>
<html>
<head>
<title>My To-Do List</title>
<style>
body{font-family:Arial;background:#f4f4f4;text-align:center;padding:40px}
.container{background:white;max-width:400px;margin:auto;padding:20px;border-radius:10px;box-shadow:0 0 10px #ccc}
input{padding:10px;width:70%}
button{padding:10px;background:green;color:white;border:none;cursor:pointer}
li{list-style:none;padding:8px;background:#eee;margin:5px 0;display:flex;justify-content:space-between;border-radius:5px}
</style>
</head>
<body>
<div class="container">
<h2>My To-Do List</h2>
<input id="taskInput" placeholder="New task...">
<button onclick="addTask()">Add</button>
<ul id="taskList"></ul>
</div>
<script>
function addTask(){
let input=document.getElementById("taskInput");
let text=input.value.trim();
if(text==="")return;
let li=document.createElement("li");
li.innerHTML=text+' <button onclick="this.parentElement.remove()" style="background:red;padding:5px">X</button>';
document.getElementById("taskList").appendChild(li);
input.value="";
}
</script>
</body>
</html>
